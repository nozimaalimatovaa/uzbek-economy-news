name: Daily Uzbekistan Economy News Digest (Free)

on:
  schedule:
    # 06:40 UTC = 11:40 по Ташкенту (UTC+5, без перевода часов).
    # Запуск заранее, т.к. GitHub Actions часто задерживает cron на 10-30 минут.
    - cron: "40 6 * * *"
    # 14:40 UTC = 19:40 по Ташкенту.
    - cron: "40 14 * * *"
  workflow_dispatch: {}

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-free.txt

      - name: Run news digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_digest_free.py
